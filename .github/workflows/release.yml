name: Build release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip if present
        run: |
          if [ -f growth-os-project.zip ]; then
            unzip -o growth-os-project.zip
            rm growth-os-project.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Add project files from zip"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Decrypt key
        env:
          KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
        run: |
          if [ ! -f release-key.enc ]; then echo "Run 'Create signing key' first"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in release-key.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEY_PASSPHRASE
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: growth-os-release-apk
          path: app/build/outputs/apk/release/app-release.apk
